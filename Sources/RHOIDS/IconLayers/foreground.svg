<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Timer ring arc: 75% coverage (270°), a timer with the first quarter
       elapsed clockwise. Gap spans the top-right quadrant (12 → 3 o'clock).
       Starts at 3 o'clock and sweeps clockwise through 6 and 9 to 12. -->
  <circle cx="512" cy="512" r="352" pathLength="100"
    fill="none"
    stroke="#34D46E"
    stroke-width="44"
    stroke-linecap="round"
    stroke-dasharray="75 25"/>

  <!-- Clock ticks in the elapsed quarter, at -72°, -54°, -36° and -18°
       (0° = 3 o'clock), from r=334 to r=370. -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round">
    <line x1="615.2" y1="194.3" x2="626.3" y2="160.1"/>
    <line x1="708.3" y1="241.8" x2="729.5" y2="212.7"/>
    <line x1="782.2" y1="315.7" x2="811.3" y2="294.5"/>
    <line x1="829.7" y1="408.8" x2="863.9" y2="397.7"/>
  </g>

  <!-- Toilet roll, end-on: white paper face and cardboard tube. The centre
       is cut out (even-odd) so the background layer shows through. -->
  <path fill="#FFFFFF" fill-rule="evenodd"
    d="M 242,512 A 270,270 0 1,0 782,512 A 270,270 0 1,0 242,512 Z
       M 388,512 A 124,124 0 1,0 636,512 A 124,124 0 1,0 388,512 Z"/>
  <path fill="#C9A57A" fill-rule="evenodd"
    d="M 388,512 A 124,124 0 1,0 636,512 A 124,124 0 1,0 388,512 Z
       M 416,512 A 96,96 0 1,0 608,512 A 96,96 0 1,0 416,512 Z"/>

  <!-- The shipped PNGs are drawn with CoreGraphics from this geometry; the
       watch foreground is the same art scaled 1.15x about the centre. -->
</svg>
